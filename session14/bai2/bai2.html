<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
<h1>Danh Sách Sản Phẩm Chợ Tết</h1>
<ul id="product-list">
</ul>
<form id="product-form">
<input type="text" id="product-name" placeholder="Tên san phẩm">
<input type="number" id="product-price" placeholder="Giá (VND)">
<button type="submit">Thêm Sản Phẩm</button>
</form>
<script>
const products = [
{ id: 1, name: "Bánh Chưng", price: 150000 },
{ id: 2, name: "Giò Lụa", price: 180000 },
{ id: 3, name: "Cành Đào", price: 500000 },
{ id: 4, name: "Mứt Tết", price: 120000 },
{ id: 5, name: "Bao Lì Xì", price: 25000 },
{ id: 6, name: "Dưa Hấu Tết", price: 80000 },
];

let productList = document.getElementById("product-list");
let form = document.getElementById("product-form");
let nameInput = document.getElementById("product-name");
let priceInput = document.getElementById("product-price");
products.forEach(function(product) {
    let li = document.createElement("li");
    li.className = "product-item";
    li.innerHTML = `${product.name} - ${product.price} VNĐ`;
    productList.appendChild(li);
});

form.addEventListener("submit", function(event){
    event.preventDefault();
    let name = nameInput.value;
    let price = priceInput.value;
    let newProduct = {
        id: products.length + 1,
        name: name,
        price: Number(price)
    };
    products.push(newProduct);
    let li = document.createElement("li");
    li.className = "product-item";
    li.innerHTML = `${newProduct.name} - ${newProduct.price} VNĐ`;
    productList.appendChild(li);
    nameInput.value = "";
    priceInput.value = "";
});
</script>
</body>
</html>
