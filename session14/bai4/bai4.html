<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Quản Lý Sản Phẩm Chợ Tết</title>
</head>
<body>

<h1>Danh Sách Sản Phẩm Chợ Tết</h1>

<ul id="product-list"></ul>

<form id="product-form">
    <input type="text" id="product-name" placeholder="Tên sản phẩm">
    <input type="number" id="product-price" placeholder="Giá (VND)">
    <button type="submit">Thêm</button>
</form>

<script>

const products = [
    { id: 1, name: "Bánh Chưng", price: 150000 },
    { id: 2, name: "Giò Lụa", price: 180000 },
    { id: 3, name: "Cành Đào", price: 500000 },
    { id: 4, name: "Mứt Tết", price: 120000 },
    { id: 5, name: "Bao Lì Xì", price: 25000 },
    { id: 6, name: "Dưa Hấu Tết", price: 80000 },
];

let productList = document.getElementById("product-list");
let form = document.getElementById("product-form");
let nameInput = document.getElementById("product-name");
let priceInput = document.getElementById("product-price");

function formatMoney(number) {
    return number.toLocaleString("vi-VN") + " VND";
}

function createProductItem(product) {
    let li = document.createElement("li");

    li.innerHTML = `
        <span>
            ${product.name} - <span class="price">${formatMoney(product.price)}</span>
        </span>
        <div>
            <button class="edit-price-btn">Sửa giá</button>
            <button class="delete-btn">Xóa</button>
        </div>
    `;

    let deleteBtn = li.querySelector(".delete-btn");
    let editBtn = li.querySelector(".edit-price-btn");
    let priceSpan = li.querySelector(".price");
    deleteBtn.addEventListener("click", function() {
        if (confirm("Bạn có chắc muốn xóa?")) {
            li.remove();
        }
    });
    editBtn.addEventListener("click", function() {
        let newPrice = prompt("Nhập giá mới (VND):");

        if (newPrice === null) return;

        newPrice = Number(newPrice);

        if (isNaN(newPrice) || newPrice <= 0) {
            alert("Giá không hợp lệ!");
            return;
        }

        product.price = newPrice;
        priceSpan.textContent = formatMoney(newPrice);
    });

    productList.appendChild(li);
}
products.forEach(function(product) {
    createProductItem(product);
});
form.addEventListener("submit", function(event) {
    event.preventDefault();

    let name = nameInput.value.trim();
    let price = Number(priceInput.value);

    if (!name || isNaN(price) || price <= 0) {
        alert("Vui lòng nhập đúng thông tin!");
        return;
    }

    let newProduct = {
        id: products.length + 1,
        name: name,
        price: price
    };

    products.push(newProduct);
    createProductItem(newProduct);

    nameInput.value = "";
    priceInput.value = "";
});

</script>

</body>
</html>
