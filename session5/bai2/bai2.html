<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
    let borrowedBooks = [];
    let count = +prompt("Hôm nay có bao nhiêu cuốn sách bị trả muộn?");

    for (let i = 0; i < count; i++) {
        let name = prompt(`Nhập tên cuốn sách bị trả muộn thứ ${i + 1}:`);
        borrowedBooks.push(name);
    }

    console.log("Tổng số sách bị trả muộn:", borrowedBooks.length);
    console.log("Danh sách sách bị trả muộn:");

    let longNameCount = 0;

    for (let i = 0; i < borrowedBooks.length; i++) {
        console.log(`${i + 1}. ${borrowedBooks[i]}`);
        if (borrowedBooks[i].length > 20) {
            longNameCount++;
        }
    }

    console.log("Số lượng sách có tên dài hơn 20 ký tự:", longNameCount);
</script>
</body>
</html>
