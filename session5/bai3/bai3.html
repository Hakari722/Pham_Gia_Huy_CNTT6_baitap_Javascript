<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
    let booksId = [];
    let booksName = [];
    let inventoryQuantity = [];

    let n = +prompt("Có bao nhiêu loại sách cần kiểm tra bổ sung hôm nay?");

    for (let i = 0; i < n; i++) {
        let id;
        do {
            id = prompt(`Nhập mã sách thứ ${i + 1}:`);
        } while (!id);

        let name;
        do {
            name = prompt(`Nhập tên sách thứ ${i + 1}:`);
        } while (!name);

        let quantity;
        do {
            quantity = +prompt(`Nhập số lượng tồn kho của sách thứ ${i + 1}:`);
        } while (quantity < 0);

        booksId.push(id);
        booksName.push(name);
        inventoryQuantity.push(quantity);
    }

    console.log(`Danh sách sách cần xem xét bổ sung (${booksId.length} loại):`);

    let lowStockCount = 0;
    let outOfStockIds = "";

    for (let i = 0; i < booksId.length; i++) {
        console.log(
            `${i + 1}. Mã: ${booksId[i]} - Tên: ${booksName[i]} - Còn: ${inventoryQuantity[i]} bản`
        );

        if (inventoryQuantity[i] <= 5) {
            lowStockCount++;
        }

        if (inventoryQuantity[i] === 0) {
            outOfStockIds += booksId[i] + " ";
        }
    }

    console.log(`Số sách có tồn kho ≤ 5 bản: ${lowStockCount}`);

    if (outOfStockIds === "") {
        console.log("Các mã sách đã hết hàng (0 bản): Không có");
    } else {
        console.log(`Các mã sách đã hết hàng (0 bản): ${outOfStockIds.trim()}`);
    }
</script>
</body>
</html>
