<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
let bookCount;
while (true) {
    bookCount = +prompt("Nhập số lượng sách trong thư viện:");

    if (bookCount >= 0) {
        break;
    }
    alert("Vui lòng nhập số hợp lệ!");
}
let message = "";
if (bookCount < 10) {
    message = "Thư viện có ít sách";
} else if (bookCount <= 20) {
    message = "Thư viện có số lượng sách vừa đủ";
} else {
    message = "Thư viện có nhiều sách";
}
console.log("Số lượng sách:", bookCount);
console.log("Thông báo:", message);

    </script>
</body>
</html>
