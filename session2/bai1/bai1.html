<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
let bookName = prompt("Nhập tên sách:");
let author = prompt("Nhập tên tác giả:");
let publishYear = +prompt("Nhập năm xuất bản:");
let currentYear = new Date().getFullYear();
let message = "";
if (publishYear === currentYear) {
    message = "Đây là sách mới!";
} else if (currentYear - publishYear <= 5) {
    message = "Sách khá mới";
} else {
    message = "Sách đã cũ";
}

console.log("Tên sách:", bookName);
console.log("Tác giả:", author);
console.log("Năm xuất bản:", publishYear);
console.log("Đánh giá:", message);

        
    </script>
</body>
</html>
