<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        let bookName = prompt("Nhập tên sách:");
        let borrowerName = prompt("Nhập tên người mượn:");
        let favoriteLevel = +prompt("Nhập mức độ yêu thích (1 - 5):");
        let message = "";
        if (favoriteLevel === 5 || favoriteLevel === 4) {
         message = "Đây là cuốn sách yêu thích của bạn, hãy đọc ngay!";
        } else if (favoriteLevel === 3) {
            message = "Sách này khá ổn, có thể mượn";       
        } else if (favoriteLevel === 2 || favoriteLevel === 1) {
            message = "Sách này bạn có thể cân nhắc mượn lại sau";
        } else {
            message = "Mức độ yêu thích không hợp lệ";
        }
        console.log("Tên sách:", bookName);
        console.log("Người mượn:", borrowerName);
        console.log("Mức độ yêu thích:", favoriteLevel);
        console.log("Đánh giá:", message);

    </script>
</body>
</html>
