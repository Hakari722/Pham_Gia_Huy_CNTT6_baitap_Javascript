<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
let playerIds = ["P001", "P002", "P003", "P004", "P005"];
let playerNames = ["Nguyễn Văn A", "Trần Thị B", "Lê Văn C", "Phạm Văn D", "Hoàng Thị E"];
let playerJerseyNumbers = [10, 7, 8, 9, 11];

function printTeamRoster() {
    console.log("--- DANH SÁCH ĐỘI BÓNG ---");
    for (let i = 0; i < playerIds.length; i++) {
        console.log(`${i + 1}. Mã: ${playerIds[i]} - Tên: ${playerNames[i]} - Số áo: ${playerJerseyNumbers[i]}`);
    }
}

function updatePlayerNameAndJersey(playerId, newName, newJerseyNumber) {
    let foundIndex = -1;
    for (let i = 0; i < playerIds.length; i++) {
        if (playerIds[i] === playerId) {
            foundIndex = i;
            break;
        }
    }

    if (foundIndex !== -1) {
        playerNames[foundIndex] = newName;
        playerJerseyNumbers[foundIndex] = newJerseyNumber;
        return true; 
    }
    return false;
}
printTeamRoster();

let inputId = prompt("Nhập mã cầu thủ muốn cập nhật (ví dụ: P001):");
let newName = prompt("Nhập tên mới cho cầu thủ:");
let newJersey = +prompt("Nhập số áo mới (1-99):");

let isSuccess = updatePlayerNameAndJersey(inputId, newName, newJersey);

if (isSuccess) {
    console.log("=> Thông báo: Cập nhật thành công!");
    printTeamRoster(); 
} else {
    console.log("=> Thông báo: Không tìm thấy cầu thủ với mã này!"); 
}
    </script>
</body>
</html>
