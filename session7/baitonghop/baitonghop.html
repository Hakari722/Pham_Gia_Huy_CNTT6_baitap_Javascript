<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
let players = [];
let goals = [];

function addPlayer(name, goal) {
    players.push(name);
    goals.push(parseInt(goal));
    console.log(`=> Đã thêm ${name} thành công.`);
}

function showSquad() {
    if (players.length === 0) {
        console.log("Danh sách đội hình hiện đang trống.");
        return;
    }
    players.forEach((name, index) => {
        console.log(`${index + 1}. ${name} - ${goals[index]} bàn`);
    });
}

const getTotalGoals = function() {
    let total = 0;
    for (let g of goals) {
        total += g;
    }
    return total;
};

function findMostGoals(goalsArray) {
    if (goalsArray.length === 0) return 0;
    let max = goalsArray[0];
    for (let i = 1; i < goalsArray.length; i++) {
        if (goalsArray[i] > max) {
            max = goalsArray[i];
        }
    }
    return max;
}

function main() {
    let choice;
    do {
        console.log("\n--- QUẢN LÝ ĐỘI BÓNG ---");
        console.log("1. Nhập cầu thủ mới");
        console.log("2. Xem danh sách đội hình");
        console.log("3. Xem thành tích toàn đội");
        console.log("4. Tìm Vua phá lưới");
        console.log("0. Thoát");

        choice = prompt("Người dùng chọn:");

        switch (choice) {
            case '1':
                let name = prompt("Nhập tên:");
                let goal = prompt("Nhập số bàn thắng:");
                addPlayer(name, goal);
                break;
            case '2':
                showSquad();
                break;
            case '3':
                console.log(`=> Tổng số bàn thắng của cả đội là: ${getTotalGoals()} bàn.`);
                break;
            case '4':
                let max = findMostGoals(goals);
                if (max === 0 && players.length === 0) {
                    console.log("=> Chưa có dữ liệu cầu thủ.");
                } else {
                    let index = goals.indexOf(max);
                    console.log(`=> Vua phá lưới hiện tại ghi được: ${max} bàn (${players[index]}).`);
                }
                break;
            case '0':
                console.log("Thoát chương trình.");
                break;
            default:
                console.log("Lựa chọn không hợp lệ.");
        }
    } while (choice !== '0');
}

main();
    </script>
</body>
</html>
