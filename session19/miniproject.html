<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mini Shop</title>
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
<div class="app">

  <header class="header">
    <h1>Mini Shop</h1>
    <button id="clear-cart-btn" class="btn btn-danger">Xóa Giỏ Hàng</button>
  </header>

  <main class="main">

    <!-- PRODUCTS -->
    <section>
      <h2>Sản phẩm</h2>
      <div id="products-empty" class="hidden">Không có sản phẩm</div>
      <div id="products-grid"></div>
    </section>

    <!-- CART -->
    <section>
      <h2>Giỏ hàng</h2>

      <p id="cart-empty" class="hidden">Giỏ hàng đang trống</p>

      <table border="1" width="100%">
        <thead>
          <tr>
            <th>Tên</th>
            <th>Giá</th>
            <th>SL</th>
            <th>Thành tiền</th>
            <th>Hành động</th>
          </tr>
        </thead>
        <tbody id="cart-tbody"></tbody>
      </table>

      <h3>Thống kê</h3>
      <p id="stat-lines"></p>
      <p id="stat-qty"></p>
      <p id="stat-total"></p>

    </section>

  </main>
</div>

<script>
// ===== SAFE PARSE =====
function safeParse(key, defaultValue) {
  try {
    return JSON.parse(localStorage.getItem(key)) || defaultValue;
  } catch {
    return defaultValue;
  }
}

// ===== FORMAT VNĐ =====
function formatVND(n) {
  return n.toLocaleString("vi-VN") + " VNĐ";
}

// ===== PRODUCTS =====
const products = [
  {
    id: 1,
    name: "Tai nghe Bluetooth",
    price: 350000,
    image: "https://via.placeholder.com/200",
    description: "Pin 8 giờ"
  },
  {
    id: 2,
    name: "Chuột không dây",
    price: 250000,
    image: "https://via.placeholder.com/200",
    description: "Ergonomic"
  },
  {
    id: 3,
    name: "Bàn phím cơ",
    price: 790000,
    image: "https://via.placeholder.com/200",
    description: "Switch blue"
  }
];
let cart = safeParse("cart", []);
function renderProducts() {
  const grid = document.getElementById("products-grid");
  const empty = document.getElementById("products-empty");

  if (products.length === 0) {
    empty.classList.remove("hidden");
    return;
  }

  empty.classList.add("hidden");

  grid.innerHTML = products.map(p => `
    <div style="border:1px solid #ccc; padding:10px; margin:10px;">
      <img src="${p.image}" width="100">
      <h3>${p.name}</h3>
      <p>${p.description}</p>
      <p>${formatVND(p.price)}</p>
      <button onclick="addToCart(${p.id})">Thêm vào giỏ</button>
    </div>
  `).join("");
}
function addToCart(id) {
  const item = cart.find(p => p.id === id);

  if (item) {
    item.quantity++;
  } else {
    const product = products.find(p => p.id === id);
    cart.push({ ...product, quantity: 1 });
  }

  saveCart();
  renderCart();
}
function saveCart() {
  localStorage.setItem("cart", JSON.stringify(cart));
}
function renderCart() {
  const tbody = document.getElementById("cart-tbody");
  const empty = document.getElementById("cart-empty");

  if (cart.length === 0) {
    tbody.innerHTML = "";
    empty.classList.remove("hidden");
    updateStats();
    return;
  }

  empty.classList.add("hidden");

  tbody.innerHTML = cart.map(item => `
    <tr>
      <td>${item.name}</td>
      <td>${formatVND(item.price)}</td>
      <td>
        <button onclick="changeQty(${item.id}, -1)">-</button>
        ${item.quantity}
        <button onclick="changeQty(${item.id}, 1)">+</button>
      </td>
      <td>${formatVND(item.price * item.quantity)}</td>
      <td>
        <button onclick="removeItem(${item.id})">Xóa</button>
      </td>
    </tr>
  `).join("");

  updateStats();
}
function changeQty(id, delta) {
  const item = cart.find(p => p.id === id);
  if (!item) return;
  item.quantity += delta;
  if (item.quantity <= 0) {
    if (confirm("Xóa sản phẩm này?")) {
      cart = cart.filter(p => p.id !== id);
    } else {
      item.quantity = 1;
    }
  }

  saveCart();
  renderCart();
}
function removeItem(id) {
  const item = cart.find(p => p.id === id);
  if (confirm(`Xóa ${item.name}?`)) {
    cart = cart.filter(p => p.id !== id);
    saveCart();
    renderCart();
  }
}
document.getElementById("clear-cart-btn").onclick = function () {
  if (confirm("Xóa toàn bộ giỏ hàng?")) {
    cart = [];
    saveCart();
    renderCart();
  }
};
function updateStats() {
  const lines = cart.length;
  const qty = cart.reduce((s, i) => s + i.quantity, 0);
  const total = cart.reduce((s, i) => s + i.price * i.quantity, 0);
  document.getElementById("stat-lines").innerText = "Tổng dòng: " + lines;
  document.getElementById("stat-qty").innerText = "Tổng SL: " + qty;
  document.getElementById("stat-total").innerText = "Tổng tiền: " + formatVND(total);
}
renderProducts();
renderCart();

</script>
</body>
</html>
