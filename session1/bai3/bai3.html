<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
       let soSachCu = prompt("Nhập số lượng sách cũ trong thư viện");
       soSachCu = Number(soSachCu);
       let soSachNhap = prompt("Nhập số lượng sách mới được nhập vào thư viện");
       soSachNhap = Number(soSachNhap);
       let tongSoSach = soSachCu + soSachNhap;
       document.write("Tổng số sách hiện tại là: " + tongSoSach);
       console.log("Tổng số sách hiện tại là: " + tongSoSach);
    </script>
</body>
</html>
