<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        let tenSach = prompt("Nhập tên sách:");
        let soThuTu = prompt("Nhập số thứ tự của sách:");      
        let tenSachChuanHoa = tenSach.trim().toUpperCase();
        soThuTu = Number(soThuTu);
        let maSach = "LIB - " + tenSachChuanHoa + " - " + soThuTu;
        document.write("Tên sách gốc: " + tenSach + "<br>");
        document.write("Mã sách sau chuẩn hóa: " + maSach);
    </script>
</body>
</html>
