<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        let tenSach = prompt ("Nhập tên cuốn sách: ");
        let namXuatBan = prompt ("Nhập năm xuất bản của sách: ");
        namXuatBan = Number(namXuatBan);
        let namHienTai = prompt("Nhập năm hiện tại: ");
        let tuoiSach = namHienTai - namXuatBan;
        document.write("Tên cuốn sách: " + tenSach + "<br>");
        document.write("Năm xuất bản cuốn sách: " + namXuatBan + "<br>");
        document.write("Tuổi của cuốn sách: " + tuoiSach);
    </script>
</body>
</html>
