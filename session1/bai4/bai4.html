<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        let tenSach = prompt("Nhập tên của một cuốn sách:");
        let tenGoc = tenSach;
        let tenHoa = tenSach.toUpperCase();    
        let tenThuong = tenSach.toLowerCase();
        console.log("tên gốc: " + tenGoc);
        console.log("Tên viết hoa: " + tenHoa);
        console.log("Tên viết thường: " + tenThuong);
    </script>
</body>
</html>
